// ═══════════════════════════════════════════
// CONTEXT — Global State (like Next.js Provider)
// ═══════════════════════════════════════════
const AppContext = createContext();

function AppProvider({ children }) {
  const [loaded, setLoaded] = useState(false);
  const [activeSection, setActiveSection] = useState('hero');
  const [formData, setFormData] = useState({ name: '', email: '', phone: '', message: '' });
  const [formErrors, setFormErrors] = useState({});
  const [formStatus, setFormStatus] = useState(null);

  const value = useMemo(() => ({
    loaded, setLoaded,
    activeSection, setActiveSection,
    formData, setFormData,
    formErrors, setFormErrors,
    formStatus, setFormStatus
  }), [loaded, activeSection, formData, formErrors, formStatus]);

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() { return useContext(AppContext); }

// ═══════════════════════════════════════════
// HOOKS — Custom React Hooks
// ═══════════════════════════════════════════
function useIntersectionReveal(threshold = 0.15) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.unobserve(el); } }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, visible];
}

function useGSAPReveal() {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || typeof gsap === 'undefined') return;
    const el = ref.current;
    gsap.from(el, {
      scrollTrigger: { trigger: el, start: 'top 88%', once: true },
      opacity: 0, y: 40, duration: 0.8, ease: 'power3.out'
    });
  }, []);
  return ref;
}

function useMousePosition() {
  const [pos, setPos] = useState({ x: 0, y: 0 });
  useEffect(() => {
    if (!window.matchMedia('(hover: hover)').matches) return;
    let mx = 0, my = 0, cx = 0, cy = 0;
    const onMove = e => { mx = e.clientX; my = e.clientY; };
    document.addEventListener('mousemove', onMove);
    let raf;
    const loop = () => {
      cx += (mx - cx) * 0.15; cy += (my - cy) * 0.15;
      setPos({ x: cx, y: cy });
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => { document.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
  }, []);
  return pos;
}

// ── Preloader ──
const Preloader = memo(function Preloader() {
  const { loaded, setLoaded } = useApp();
  const [progress, setProgress] = useState(0);
  const barRef = useRef(null);

  useEffect(() => {
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() * 15 + 5;
      if (p > 100) p = 100;
      setProgress(Math.round(p));
      if (barRef.current) barRef.current.style.width = p + '%';
      if (p >= 100) {
        clearInterval(iv);
        setTimeout(() => {
          gsap.to('#preloaderEl', {
            yPercent: -100, duration: 1, ease: 'power4.inOut',
            onComplete: () => setLoaded(true)
          });
        }, 400);
      }
    }, 120);
    return () => clearInterval(iv);
  }, []);

  if (loaded) return null;
  return (
    <div className="preloader" id="preloaderEl">
      <div className="preloader-logo">St.Athena</div>
      <div className="preloader-bar-track"><div className="preloader-bar" ref={barRef}></div></div>
      <div className="preloader-percent">{progress}%</div>
    </div>
  );
});

const Cursor = memo(function Cursor() {
  const pos = useMousePosition();
  const [hover, setHover] = useState(false);

  useEffect(() => {
    const addHover = () => setHover(true);
    const removeHover = () => setHover(false);
    const els = document.querySelectorAll('a, button, .service-card, .gallery-item');
    els.forEach(el => { el.addEventListener('mouseenter', addHover); el.addEventListener('mouseleave', removeHover); });
    return () => els.forEach(el => { el.removeEventListener('mouseenter', addHover); el.removeEventListener('mouseleave', removeHover); };
  });

  if (!window.matchMedia('(hover: hover)').matches) return null;
  return <div className={`cursor ${hover ? 'hover' : ''}`} style={{ left: pos.x + 'px', top: pos.y + 'px' }} />;

// ── Contact Form (React State Management) ──
function ContactForm() {
  const { formData, setFormData, formErrors, setFormErrors, formStatus, setFormStatus } = useApp();
  const [sending, setSending] = useState(false);

  const handleChange = (field) => (e) => {
    setFormData(prev => ({ ...prev, [field]: e.target.value }));
    if (formErrors[field]) setFormErrors(prev => ({ ...prev, [field]: null }));
  };

  const validate = useCallback(() => {
    const errors = {};
    if (!formData.name || formData.name.trim().length < 2) errors.name = true;
    if (!formData.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) errors.email = true;
    if (!formData.message || formData.message.trim().length < 5) errors.message = true;
    return errors;
  }, [formData]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    const errors = validate();
    if (Object.keys(errors).length > 0) { setFormErrors(errors); return; }

    setSending(true);
    setFormStatus('sending');
    try {
      await fetch('https://formsubmit.co/ajax/jenic.daki@gmail.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ ...formData, _subject: 'Poruka sa St.Athena sajta' })
      });
    } catch {}
    setFormStatus('success');
    setFormData({ name: '', email: '', phone: '', message: '' });
    setSending(false);
  };

  return (
    <div className="contact-form-wrap">
      <h3>Pošaljite poruku</h3>
      <form onSubmit={handleSubmit} noValidate>
        <div className="form-row">
          <div className={`form-group ${formErrors.name ? 'error' : ''}`}>
            <label>Ime *</label>
            <input type="text" value={formData.name} onChange={handleChange('name')} placeholder="Vaše ime" />
            <span className="error-text">Molimo unesite ime</span>
          </div>
          <div className={`form-group ${formErrors.email ? 'error' : ''}`}>
            <label>Email *</label>
            <input type="email" value={formData.email} onChange={handleChange('email')} placeholder="vas@email.com" />
            <span className="error-text">Molimo unesite ispravan email</span>
          </div>
        </div>
        <div className="form-group">
          <label>Telefon</label>
          <input type="tel" value={formData.phone} onChange={handleChange('phone')} placeholder="+381 6x xxx xxxx" />
        </div>
        <div className={`form-group ${formErrors.message ? 'error' : ''}`}>
          <label>Poruka *</label>
          <textarea rows="4" value={formData.message} onChange={handleChange('message')} placeholder="Vaša poruka..."></textarea>
          <span className="error-text">Molimo unesite poruku</span>
        </div>
        <button type="submit" className="form-submit" disabled={sending}>
          {sending ? 'Slanje...' : 'Pošalji poruku'}
        </button>
        {formStatus === 'sending' && <div className="form-status sending">Slanje poruke...</div>}
        {formStatus === 'success' && <div className="form-status success">Hvala! Poruka je poslata.</div>}
      </form>
    </div>
  );
}
